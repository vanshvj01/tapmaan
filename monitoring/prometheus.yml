# Prometheus scrapes /metrics on every Tapmaan microservice every 10 seconds.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: tapmaan
    static_configs:
      - targets:
          - data-service:4000
          - monitoring-service:4001
          - forecast-service:4002
          - hotspot-service:4003
          - advisory-service:4004
          - alert-service:4005
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '$1'
