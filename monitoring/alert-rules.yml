# Operational alerts for the platform itself (not heatwave alerts).
groups:
  - name: tapmaan-services
    rules:
      - alert: ServiceDown
        expr: up{job="tapmaan"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}. Its routes are returning 503 at the gateway."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(tapmaan_http_requests_total{status=~"5.."}[2m]))
            / sum by (service) (rate(tapmaan_http_requests_total[2m])) > 0.2
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} error rate above 20%"

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(tapmaan_http_request_duration_seconds_bucket[5m]))) > 2
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency above 2s"
