# Tapmaan CI/CD
#
#   1. test         domain logic unit tests + syntax check of every service
#   2. integration  build all images, start the stack with Docker Compose,
#                   smoke test every route through the gateway, then stop one
#                   service and prove the others keep working
#   3. publish      on main only: push one image per service to GitHub
#                   Container Registry (ghcr.io), tagged with the commit SHA
#                   and "latest". Uses the built-in GITHUB_TOKEN; no secrets.
#
# The static frontend continues to deploy to Vercel from the same repository.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Domain logic tests (IMD criteria, heat index, hotspot score)
        run: npm test
      - name: Syntax check every service
        run: for f in services/*/server.js services/shared/*.js api/*.js api/_lib/*.js; do node --check "$f"; done

  integration:
    name: Integration (Docker Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 120
        env:
          APP_VERSION: ${{ github.sha }}

      - name: Show running services
        run: docker compose ps

      - name: Smoke test through the gateway
        run: ./scripts/smoke-test.sh http://localhost:8080

      - name: Fault isolation — stop hotspot-service
        run: |
          docker compose stop hotspot-service
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/hotspots)
          echo "hotspots -> $code (expected 503)"
          test "$code" = "503"
          curl -sf "http://localhost:8080/api/forecast?station=nagpur&demo=1" | grep -q '"ok":true'
          curl -sf "http://localhost:8080/api/alerts?demo=1" | grep -q '"ok":true'
          echo "Other services unaffected."

      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: data-service,       dockerfile: services/data-service/Dockerfile }
          - { name: monitoring-service, dockerfile: services/monitoring-service/Dockerfile }
          - { name: forecast-service,   dockerfile: services/forecast-service/Dockerfile }
          - { name: hotspot-service,    dockerfile: services/hotspot-service/Dockerfile }
          - { name: advisory-service,   dockerfile: services/advisory-service/Dockerfile }
          - { name: alert-service,      dockerfile: services/alert-service/Dockerfile }
          - { name: gateway,            dockerfile: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/tapmaan-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/tapmaan-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
