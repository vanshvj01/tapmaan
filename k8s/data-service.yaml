apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: tapmaan
  labels: { app: data-service, part-of: tapmaan }
spec:
  replicas: 1
  selector:
    matchLabels: { app: data-service }
  template:
    metadata:
      labels: { app: data-service, part-of: tapmaan }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: data-service
          image: tapmaan/data-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - name: PORT
              value: "4000"
            - name: APP_VERSION
              valueFrom: { configMapKeyRef: { name: tapmaan-config, key: APP_VERSION } }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: tapmaan
spec:
  selector: { app: data-service }
  ports: [{ port: 4000, targetPort: 4000 }]
