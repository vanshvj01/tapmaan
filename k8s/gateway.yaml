apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tapmaan
  labels: { app: gateway, part-of: tapmaan }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, part-of: tapmaan }
    spec:
      containers:
        - name: gateway
          image: tapmaan/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          env:
            # nginx's resolver ignores DNS search domains, so services are
            # addressed by their fully qualified cluster name.
            - name: SERVICE_SUFFIX
              value: .tapmaan.svc.cluster.local
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tapmaan
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
